name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Alembic models are in sync with migrations
        run: |
          export DB_HOST=localhost DB_PORT=5433 DB_NAME=test DB_USER=test DB_PASSWORD=test
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest --cov --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5433/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: npm ci
      - name: Generated API client matches the backend schema
        run: |
          (cd ../backend && uv sync --frozen && uv run python -m api.openapi_export) > openapi.json
          npm run gen
          git diff --exit-code -- . || (echo "Run 'make gen' and commit the result" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # One job for both images: its name is a required status check in the branch rulesets.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
