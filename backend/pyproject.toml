[project]
name = "club110-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "apscheduler<4",
    "apscheduler-dishka>=1.1.1",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi>=0.142.2",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 120
target-version = "py313"
output-format = "concise"
fix = false

# Queries are hand-formatted as one chained call per line (see CLAUDE.md); the formatter would re-join them.
[tool.ruff.format]
exclude = ["app/repositories/*", "app/queries/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "B", "UP", "I", "SIM", "C4", "RUF", "ANN", "N", "S", "T", "Q", "A", "R", "PL", "ISC",
    "PIE", "PGH", "TID", "COM", "RET", "PTH", "G", "FA", "ERA", "TRY", "RSE", "SLF", "EXE", "EM", "INP",
    "PT", "DTZ", "LOG", "BLE", "TC", "FBT", "ASYNC", "PERF", "ARG",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic in strings/comments is intentional
    "COM812",                      # conflicts with ruff format
    "TRY003", "EM101", "EM102",    # domain exceptions take a message argument
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["INP001", "E501"]
"migrations/env.py" = ["INP001"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ANN", "SLF001", "ARG001", "FBT", "INP001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "bot", "worker"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["app", "api", "bot", "worker", "main.py", "migrations", "tests"]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["app", "api", "bot", "worker"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
